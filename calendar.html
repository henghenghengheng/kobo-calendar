<!DOCTYPE html><html><head><meta charset="utf-8"><title>Kobo Calendar Timetable</title><style>
body {font-family:Monaco, monospace; background:#fff; margin:0; padding:0.5em;}
.container {display:flex; width:100%;}
.hour-labels {width:40px; display:flex; flex-direction:column; margin-top:40px;}
.hour-labels div {height:60px; font-size:0.7em; text-align:right; padding-right:2px; border-bottom:1px solid #eee;}
.week {display:flex; flex:1;}
.day-column {flex:1; position:relative; margin-left:2px;}
.day-column-header {text-align:center; font-weight:bold; font-size:0.9em; height:20px; line-height:20px; border-bottom:1px solid #ccc;}
.event {position:absolute; left:2px; right:2px; background:#555; color:#fff; font-size:0.75em; padding:1px; border-radius:2px; line-height:1em;}
.event .time {font-size:0.65em;}
.all-day {position:absolute; left:2px; right:2px; top:20px; background:#999; color:#fff; font-size:0.75em; padding:1px; border-radius:2px;}
</style></head><body>
<div class="container">
<div class="hour-labels">
<div>06:00</div>
<div>07:00</div>
<div>08:00</div>
<div>09:00</div>
<div>10:00</div>
<div>11:00</div>
<div>12:00</div>
<div>13:00</div>
<div>14:00</div>
<div>15:00</div>
<div>16:00</div>
<div>17:00</div>
<div>18:00</div>
<div>19:00</div>
<div>20:00</div>
<div>21:00</div>
<div>22:00</div>
<div>23:00</div>
</div>
<div class="week">
<div class="day-column"><div class="day-column-header">Sunday 19</div>
</div>
<div class="day-column"><div class="day-column-header">Monday 20</div>
<div class="event" style="top:40.0px; height:60.0px;">Facial<br><span class="time">06:00 - 07:00</span></div>
</div>
<div class="day-column"><div class="day-column-header">Tuesday 21</div>
<div class="event" style="top:1030.0px; height:60.0px;">Date night 🩷<br><span class="time">22:30 - 23:30</span></div>
</div>
<div class="day-column"><div class="day-column-header">Wednesday 22</div>
</div>
<div class="day-column"><div class="day-column-header">Thursday 23</div>
</div>
<div class="day-column"><div class="day-column-header">Friday 24</div>
</div>
<div class="day-column"><div class="day-column-header">Saturday 25</div>
</div>
</div></div></body></html>
